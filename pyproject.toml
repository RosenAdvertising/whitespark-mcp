[project]
name = "whitespark-mcp"
version = "0.1.0"
description = "MCP server for Whitespark: read-only ranking grid data and screenshots."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/RosenAdvertising/whitespark-mcp"
Repository = "https://github.com/RosenAdvertising/whitespark-mcp"
Issues = "https://github.com/RosenAdvertising/whitespark-mcp/issues"

[project.scripts]
whitespark-mcp-setup = "whitespark_mcp.setup:setup"
whitespark-mcp-verify = "whitespark_mcp.setup:verify"
whitespark-mcp = "whitespark_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0,<0.23",
    "ruff>=0.12.7,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

